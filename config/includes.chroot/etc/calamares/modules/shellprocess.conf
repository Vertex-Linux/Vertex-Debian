# Cleans up live-session-only stuff that unpackfs otherwise copies onto
# the target disk verbatim (it just clones the whole live filesystem):
# the installer itself, the live-boot/live-config packages, and GDM's
# autologin config that live-config sets up for the live session.
---
dontChroot: false
timeout: 30

script:
    - "rm -f /usr/share/applications/vertex-installer.desktop"
    - "sed -i '/^AutomaticLoginEnable/d;/^AutomaticLogin=/d' /etc/gdm3/daemon.conf 2>/dev/null || true"
    - "apt-get purge -y calamares calamares-settings-debian live-boot live-boot-initramfs-tools live-config live-config-systemd 2>/dev/null || true"
    - "apt-get autoremove -y 2>/dev/null || true"
