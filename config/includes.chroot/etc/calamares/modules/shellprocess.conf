# Cleans up live-session-only stuff that unpackfs otherwise copies onto
# the target disk verbatim (it just clones the whole live filesystem):
# the installer itself, the live-boot/live-config packages, and GDM's
# autologin config that live-config sets up for the live session. Also
# pre-seeds AccountsService's cache so GDM doesn't think this is a
# brand-new system with no users.
#
# The autologin cleanup covers both possible config locations —
# /etc/gdm3/daemon.conf is often just a template; the actually-active
# runtime config commonly lives at /var/lib/gdm3/.config/gdm/custom.conf.
#
# The AccountsService bit is the confirmed real cause of ending up in a
# full session under GDM's own internal "gdm-greeter" service account
# instead of a login screen for the account Calamares actually created:
# GDM's own built-in first-boot logic (independent of the separate
# gnome-initial-setup package, which we also purge below) launches a
# setup flow whenever it doesn't detect an existing user account — and it
# does that check against /var/lib/AccountsService/users/ on disk, not a
# live query. accounts-daemon only writes that cache file lazily, so on a
# fresh Calamares install it's empty even though `busctl call
# org.freedesktop.Accounts ... ListCachedUsers` correctly reports the new
# account via D-Bus once the daemon is actually running. Pre-creating the
# file ourselves (for whichever user lands at uid 1000 — always the first
# account Calamares creates) satisfies GDM's check before that daemon ever
# starts for real. AccountType=1 mirrors their "sudo" group membership.
# Icon= (if branding/pfp.png was provided) makes GDM's greeter avatar
# picker show it immediately too — ~/.face (seeded via /etc/skel) covers
# apps that read that file directly instead.
#
# Note: shellprocess pre-scans these strings for $word patterns (any $
# followed by letters/digits/underscore — not just real bash variable
# names, confirmed by $1 getting flagged too) and errors out treating them
# as undefined Calamares GlobalStorage placeholders. So the uid-1000 lookup
# below is repeated via $(...) command substitution inline rather than
# stored in any variable, since $(...) itself doesn't match that pattern.
---
dontChroot: false
timeout: 30

script:
    - "rm -f /usr/share/applications/vertex-installer.desktop"
    - "sed -i '/^AutomaticLoginEnable/d;/^AutomaticLogin=/d' /etc/gdm3/daemon.conf 2>/dev/null || true"
    - "sed -i '/^AutomaticLoginEnable/d;/^AutomaticLogin=/d' /var/lib/gdm3/.config/gdm/custom.conf 2>/dev/null || true"
    - |
      if [ -n "$(getent passwd 1000 | cut -d: -f1)" ]; then
          mkdir -p /var/lib/AccountsService/users /var/lib/AccountsService/icons
          if [ -f /usr/share/vertex/face.png ]; then
              cp /usr/share/vertex/face.png "/var/lib/AccountsService/icons/$(getent passwd 1000 | cut -d: -f1)"
          fi
          cat > "/var/lib/AccountsService/users/$(getent passwd 1000 | cut -d: -f1)" <<ACCOUNTSVCEOF
      [User]
      Language=
      XSession=
      SystemAccount=false
      AccountType=1
      Icon=/var/lib/AccountsService/icons/$(getent passwd 1000 | cut -d: -f1)
      ACCOUNTSVCEOF
      fi
    - "apt-get purge -y calamares calamares-settings-debian live-boot live-boot-initramfs-tools live-config live-config-systemd gnome-initial-setup 2>/dev/null || true"
    - "apt-get autoremove -y 2>/dev/null || true"
